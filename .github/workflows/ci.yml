name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
      NEXT_TELEMETRY_DISABLED: 1
      TEST_DATABASE_URL: postgresql://macromap:macromap@localhost:5432/macromap
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: macromap
          POSTGRES_PASSWORD: macromap
          POSTGRES_USER: macromap
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U macromap -d macromap"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Validate
        run: npm run validate

      - name: Audit high-severity production and development dependencies
        run: npm run audit

      - name: Summarise cost-sensitive files
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if git diff --name-only "$BASE_SHA"...HEAD | grep -Eq '^(infra/|\.github/workflows/|docs/(cost-model|technical-architecture)\.md|package(-lock)?\.json|compose\.yaml)'; then
            echo "### Cost review" >> "$GITHUB_STEP_SUMMARY"
            echo "Cost-sensitive files changed. Confirm the PR classification and human approval requirements." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Cost review" >> "$GITHUB_STEP_SUMMARY"
            echo "No known cost-sensitive files changed." >> "$GITHUB_STEP_SUMMARY"
          fi

  cdk-diff:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      vars.AWS_READ_ONLY_ROLE_ARN != '' &&
      vars.AWS_ACCOUNT_ID != '' &&
      vars.MACROMAP_HOSTED_ZONE_ID != ''
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      CDK_DEFAULT_ACCOUNT: ${{ vars.AWS_ACCOUNT_ID }}
      MACROMAP_HOSTED_ZONE_ID: ${{ vars.MACROMAP_HOSTED_ZONE_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build deployable assets
        run: npm run build

      - name: Assume the read-only AWS role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: eu-west-2
          role-to-assume: ${{ vars.AWS_READ_ONLY_ROLE_ARN }}
          role-session-name: MacroMapPullRequestDiff

      - name: Produce a read-only CDK diff
        run: npm run cdk:diff
