name: Deploy production

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macromap-production-deployment
  cancel-in-progress: false

jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      CDK_DEFAULT_ACCOUNT: ${{ vars.AWS_ACCOUNT_ID }}
      MACROMAP_HOSTED_ZONE_ID: ${{ vars.MACROMAP_HOSTED_ZONE_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build deployable assets
        run: npm run build

      - name: Assume the read-only AWS role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: eu-west-2
          role-to-assume: ${{ vars.AWS_READ_ONLY_ROLE_ARN }}
          role-session-name: MacroMapProductionPlan

      - name: Show the proposed infrastructure changes
        run: npm run cdk:diff

      - name: Upload the reviewed cloud assembly
        uses: actions/upload-artifact@v4
        with:
          name: macromap-cloud-assembly-${{ github.sha }}
          path: cdk.out
          if-no-files-found: error
          retention-days: 2

  deploy:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download the reviewed cloud assembly
        uses: actions/download-artifact@v5
        with:
          name: macromap-cloud-assembly-${{ github.sha }}
          path: cdk.out

      - name: Assume the protected deployment role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: eu-west-2
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: MacroMapProductionDeploy

      - name: Deploy the reviewed cloud assembly
        env:
          BUDGET_EMAIL: ${{ secrets.MACROMAP_BUDGET_EMAIL }}
        run: >-
          npx cdk deploy
          --app cdk.out
          --all
          --require-approval never
          --parameters MacroMapProduction:BudgetNotificationEmail="$BUDGET_EMAIL"
