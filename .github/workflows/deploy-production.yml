name: Deploy production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macromap-production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build deployable assets
        run: npm run build

      - name: Assume the deployment role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: eu-west-2
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: MacroMapProductionDeploy

      - name: Show the proposed infrastructure changes
        run: npm run cdk:diff

      - name: Deploy the synthesised cloud assembly
        env:
          BUDGET_EMAIL: ${{ secrets.MACROMAP_BUDGET_EMAIL }}
        run: |
          if [[ -z "$BUDGET_EMAIL" ]]; then
            echo "::error::MACROMAP_BUDGET_EMAIL is not configured"
            exit 1
          fi

          npx cdk deploy \
            --app cdk.out \
            --all \
            --require-approval never \
            --parameters MacroMapProduction:BudgetNotificationEmail="$BUDGET_EMAIL"
