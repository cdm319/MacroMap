services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: macromap
      POSTGRES_PASSWORD: macromap
      POSTGRES_USER: macromap
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U macromap -d macromap']
      interval: 2s
      timeout: 3s
      retries: 15
    ports:
      - '55432:5432'
    volumes:
      - macromap-postgres-data:/var/lib/postgresql/data

volumes:
  macromap-postgres-data:
